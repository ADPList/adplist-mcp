version: 2.1

# Tests need Node >= 22.18 (type stripping on by default; 22.6-22.17 need --experimental-strip-types).
jobs:
  test:
    docker:
      - image: cimg/node:22.18
    steps:
      - checkout
      - run: node --version
      - run: npm ci
      - run: npm run type-check
      - run: npm test

workflows:
  test:
    jobs:
      - test
