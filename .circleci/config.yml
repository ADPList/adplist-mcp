version: 2.1

# Tests need Node >= 22.6 (node --test loads .ts sources via type stripping).
jobs:
  test:
    docker:
      - image: cimg/node:22.12
    steps:
      - checkout
      - run: node --version
      - run: npm ci
      - run: npm run type-check
      - run: npm test

workflows:
  test:
    jobs:
      - test
